formatVersion: v1
type: deployment
labels:
  robot: A3_ULTRA
spec:
  - app: motion_player
    executable: aimrt_main
    module: MotionPlayerModule
    processor: mdu
    mode: pkg
    net:
      http:
        - listen_port: 56444
          is_net_plugin: True
          clients:
            - agent
  - app: motion_streamer
    executable: aimrt_main
    module:
      - A2MotionStreamer
      - MotionStreamerA2Vr
    mode: pkg
    processor: mdu
    net:
      http:
        - listen_port: 50070
          is_net_plugin: True
          clients:
            - aim_master
      udp:
        - listen_port: 56640
          is_net_plugin: True
          constraint:
            env:
              MOCAP_TYPE:
                - IO_VR
                - IO_MOCAP
          clients:
            - mocap_suit
            - vr
            - rtc
        - listen_port: 56641
          is_net_plugin: True
          constraint:
            env:
              MOCAP_TYPE: VR
  - app: ota_master
    executable: ota_master
    module: ota_master
