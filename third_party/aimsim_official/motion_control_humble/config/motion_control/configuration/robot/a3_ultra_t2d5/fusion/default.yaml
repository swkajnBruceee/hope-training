use_external_odometry: False
waist_imu_enable: True
convert_torso_imu_to_waist: False
model_q_end_seq: [0, 2, 1, 3]                           # 0:leg; 2:waist; 3:head; 1:arm;
joint_vel_filter_alpha: 
  [
    1, 1, 1, 1, 1, 1,                       # left leg
    1, 1, 1, 1, 1, 1,                       # right leg
    1, 1, 1,                                          # waist
    1, 1, 1, 1, 1, 1, 1,                                # left arm
    1, 1, 1, 1, 1, 1, 1,                                 # right arm
    0, 0
  ]

joint_acc_filter_alpha: 
  [
    0.8, 0.8, 0.8, 0.8, 0.8, 0.8,                       # left leg
    0.8, 0.8, 0.8, 0.8, 0.8, 0.8,                       # right leg
    0.8, 0.8, 0.8,                                          # waist
    1, 1, 1, 1, 1, 1, 1,                                # left arm
    1, 1, 1, 1, 1, 1, 1,                                 # right arm
    0, 0,
  ]


