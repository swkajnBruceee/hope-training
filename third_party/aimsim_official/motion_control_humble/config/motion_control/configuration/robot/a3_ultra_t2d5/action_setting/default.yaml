RESIDENT_SETTING:
  ###########################################################################################################################
  action_manager:
    runner:
      - name: 'action_manager'
        enable: True
        debug_info: True
    period: 0.01
    priority: 0 #50
    cpu_affinity: 64 # CPU 6
    start_delay: 0

  runner_monitor:
    runner:
      - name: 'runner_monitor'
        enable: True
        debug_info: True
    period: 0.01
    priority: 0 #50
    cpu_affinity: 64 # CPU 6
    start_delay: 0

  ros2_runner:
    runner:
      - name: 'ros2_runner'
        enable: True          # 调试时自行打开，默认设为false，避免占用cpu资源
        debug_info: True
    period: 0.01
    priority: 0
    cpu_affinity: 64 # CPU 6
    start_delay: 0

  security_guard:
    runner:
      - name: 'security_monitor'
        enable: True
        debug_info: True
      - name: 'security_handler'
        enable: True
        debug_info: True
    period: 0.1
    priority: 0
    cpu_affinity: 64 # CPU 6
    start_delay: 0

  fusion:
    runner:
      - name: 'fusion'
        enable: True
        debug_info: True
    period: 0.01
    priority: 0
    cpu_affinity: 64 # CPU 6
    start_delay: 0

  ###########################################################################################################################

