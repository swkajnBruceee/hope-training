name: ppo_joint_coordinator_v21_stagger_support

runner:
  num_steps_per_env: 64
  max_iterations: 500
  save_interval: 25
  empirical_normalization: true

policy:
  actor_hidden_dims: [256, 128, 64]
  critic_hidden_dims: [256, 128, 64]
  activation: elu
  init_noise_std: 0.08

algorithm:
  # The legacy 204-D actor and seven arm outputs stay frozen. Only the
  # stagger-aware leg/waist adapter and the new critic are optimized.
  learning_rate: 0.0001
  schedule: fixed
  desired_kl: 0.01
  entropy_coef: 0.0005
  num_learning_epochs: 3
  num_mini_batches: 2
  gamma: 0.99
  lam: 0.95
  clip_param: 0.2
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  max_grad_norm: 1.0
  normalize_advantage_per_mini_batch: false
