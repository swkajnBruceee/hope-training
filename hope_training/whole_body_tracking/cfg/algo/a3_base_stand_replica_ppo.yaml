# H1-flat PPO baseline for A3BaseStandReplica only. Do not use this profile for
# A3BaseStand-v0 or strike training.
name: a3_base_stand_replica_ppo

runner:
  num_steps_per_env: 24
  max_iterations: 500
  save_interval: 50
  empirical_normalization: false

policy:
  actor_hidden_dims: [128, 128, 128]
  critic_hidden_dims: [128, 128, 128]
  activation: elu
  init_noise_std: 1.0

algorithm:
  learning_rate: 0.001
  schedule: adaptive
  desired_kl: 0.01
  entropy_coef: 0.01
  num_learning_epochs: 5
  num_mini_batches: 4
  gamma: 0.99
  lam: 0.95
  clip_param: 0.2
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  max_grad_norm: 1.0
