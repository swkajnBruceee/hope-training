# PPO for the fixed-base processed-reference strike task.
# Actor mean is initialized to zero by scripts/train.py; Gaussian noise explores
# bounded residuals around the motion reference.

name: ppo_fixed_base_reference_strike_from_scratch

runner:
  num_steps_per_env: 64
  max_iterations: 1000
  save_interval: 50
  empirical_normalization: true

policy:
  actor_hidden_dims: [256, 128, 64]
  critic_hidden_dims: [256, 128, 64]
  activation: elu
  init_noise_std: 0.08

algorithm:
  learning_rate: 0.0003
  schedule: adaptive
  desired_kl: 0.01
  entropy_coef: 0.001
  num_learning_epochs: 4
  num_mini_batches: 4
  gamma: 0.99
  lam: 0.95
  clip_param: 0.2
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  max_grad_norm: 1.0

