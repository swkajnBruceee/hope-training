# Current-contract F1 PPO settings.  This keeps the prepared 126-D/14-D
# Stage-A actor contract while adapting the floating-base leg stabilizer.
name: ppo_retrain_f1

runner:
  num_steps_per_env: 64
  max_iterations: 3000
  save_interval: 100
  empirical_normalization: true

policy:
  actor_hidden_dims: [256, 128, 64]
  critic_hidden_dims: [256, 128, 64]
  activation: elu
  init_noise_std: 0.05

algorithm:
  learning_rate: 0.0001
  schedule: adaptive
  desired_kl: 0.01
  entropy_coef: 0.0005
  num_learning_epochs: 3
  num_mini_batches: 2
  gamma: 0.99
  lam: 0.95
  clip_param: 0.2
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  max_grad_norm: 1.0
  normalize_advantage_per_mini_batch: false
