name: ppo_joint_coordinator_v22_wide_deep_stability

runner:
  # A longer rollout improves credit assignment from the strike through the
  # recovery failure around control step 190-205.
  num_steps_per_env: 96
  max_iterations: 1500
  save_interval: 25
  empirical_normalization: true

policy:
  actor_hidden_dims: [256, 128, 64]
  critic_hidden_dims: [256, 128, 64]
  activation: elu
  init_noise_std: 0.04

algorithm:
  learning_rate: 0.00005
  schedule: fixed
  desired_kl: 0.008
  entropy_coef: 0.0002
  num_learning_epochs: 3
  num_mini_batches: 2
  gamma: 0.995
  lam: 0.95
  clip_param: 0.15
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  max_grad_norm: 0.7
  normalize_advantage_per_mini_batch: false
