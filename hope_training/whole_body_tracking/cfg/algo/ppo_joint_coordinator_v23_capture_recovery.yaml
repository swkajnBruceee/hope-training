name: ppo_joint_coordinator_v23_capture_recovery

runner:
  num_steps_per_env: 96
  max_iterations: 1000
  save_interval: 25
  empirical_normalization: true

policy:
  actor_hidden_dims: [256, 128, 64]
  critic_hidden_dims: [256, 128, 64]
  activation: elu
  init_noise_std: 0.06
  recovery_arm_std_scale: 0.10

algorithm:
  learning_rate: 0.00015
  schedule: fixed
  desired_kl: 0.008
  entropy_coef: 0.0005
  num_learning_epochs: 4
  num_mini_batches: 4
  gamma: 0.995
  lam: 0.95
  clip_param: 0.15
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  max_grad_norm: 0.7
  normalize_advantage_per_mini_batch: false
