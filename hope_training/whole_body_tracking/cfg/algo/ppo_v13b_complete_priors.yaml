name: ppo_v13b_complete_priors

runner:
  num_steps_per_env: 24
  max_iterations: 50000
  save_interval: 100
  empirical_normalization: true

policy:
  actor_hidden_dims: [512, 256, 128]
  critic_hidden_dims: [512, 256, 128]
  activation: elu
  # Direct 26-D exploration must begin below the prior-assisted stability
  # envelope; the 128x20 preflight validates this before any long run.
  init_noise_std: 0.05

algorithm:
  learning_rate: 0.0003
  schedule: adaptive
  desired_kl: 0.01
  entropy_coef: 0.004
  num_learning_epochs: 5
  # 16,384 envs × 24 rollout steps / 6 = 65,536 samples per minibatch,
  # closely preserving the previous 10,000-env minibatch scale (60,000).
  num_mini_batches: 6
  gamma: 0.99
  lam: 0.95
  clip_param: 0.2
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  max_grad_norm: 1.0
