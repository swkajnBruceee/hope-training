# =============================================================================
# Main Hydra config for HOPE Agibot A3 WBC training.
#
# Usage:
#   python scripts/train.py task=HOPEPingPong algo=ppo headless=true \
#       logger=tensorboard motion_file=sample_motions/agibot_a3_smoke_stand.npz
#
# Pick the task/algo YAML with `task=...` / `algo=...`; override any field on the
# CLI (e.g. num_envs=2048 max_iterations=20000 seed=1 task.rewards.racket_position_weight=5).
# =============================================================================

defaults:
  - task: HOPEPingPong
  - algo: ppo
  - _self_

headless: true
device: cuda:0
seed: 0
policy_std_scale: 1.0  # continuation diagnostic: multiply loaded policy std after checkpoint load
policy_std_max: null   # optional Recovery distribution cap, applied after every PPO update
policy_std_min: null   # optional Recovery distribution floor
freeze_actor_mean: false  # diagnostic: freeze actor mean after loading a Recovery checkpoint
recovery_v23: false       # use the separately frozen v2.3 distribution-only smoke budget

# Override the task defaults when set (null -> use the task/algo YAML value).
num_envs: null
max_iterations: null
registry_name: null     # falls back to task.registry_name when null
motion_file: null        # local .npz path; preferred for public smoke runs
motion_manifest: null    # manifest.json path for multi-motion training
manifest_subset_size: null
manifest_frame_z_offset: null
validate_stance_contract: false  # opt-in prepositioned-manifest validation
stance_contract_mode: null       # null=allow fixed/prepositioned mixed manifests
run_name: null
resume: false
load_run: null
checkpoint: null

# logging
logger: tensorboard     # tensorboard | wandb | neptune
log_project_name: hope_wbc

# video capture (off by default)
video: false
video_length: 200
video_interval: 2000

# keep the working directory at the launch dir so logs/ lands next to the legacy script's logs
hydra:
  job:
    chdir: false
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
