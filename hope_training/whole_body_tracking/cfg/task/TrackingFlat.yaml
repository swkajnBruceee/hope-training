# =============================================================================
# Plain BeyondMimic motion tracking on the Agibot A3 (baseline, no racket target).
# Selected with `task=TrackingFlat`. Train + verify this before the HOPE task.
# Composes the shared env/sim bases; no racket/reward overrides (uses env defaults).
# =============================================================================

name: TrackingFlat
gym_task: Tracking-Flat-AgibotA3-v0
experiment_name: agibot_a3_flat

# prefix is the wandb ORG (WANDB_REGISTRY_ORG), not the team — registries are org-scoped.
registry_name: ${oc.env:WANDB_REGISTRY_ORG,your-wandb-org}/wandb-registry-motions/hope_forehand

defaults:
  - /base/env_base@_here_
  - /base/sim_base@_here_
  - _self_
