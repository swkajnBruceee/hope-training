# P0 proves predictive support under the current high-speed strike envelope.
# Frozen model_3396/model_900 and the validated V15/V17 execution contract
# remain unchanged; only zero-initialized leg/waist support adapters learn.
defaults:
  - HOPEA3JointCoordinatorV17PredictiveWaistGuardAudit
  - _self_

name: HOPEA3JointCoordinatorV19MomentumPreviewP0
gym_task: HOPE-FloatingJointCoordinatorV6MomentumPreview-AgibotA3-v0
experiment_name: agibot_a3_joint_coordinator_v19_momentum_preview_p0_20260727

motion_manifest: sample_motions/p2_data260708_backhand_strike_only_v2_momentum/manifest.json

env:
  # Exact impact is control step 80. P0 stops shortly afterward so the adapter
  # first learns anticipatory support instead of merely delaying a later fall.
  # Full-cycle qualification uses the companion audit task.
  episode_length_s: 1.9

motion:
  # P0 model_99 improved both hit-momentum metrics on motions 0/2/4 but
  # sacrificed 1/3/5. Rebalance exposure without exposing motion IDs to the
  # actor or introducing motion-specific control parameters.
  hard_case_probability: 0.45
  hard_case_motion_ids: [1, 3, 5]

rewards:
  # P0 isolates anticipatory support. The preview branch is structurally zero
  # after impact, so delayed recovery shaping otherwise overwhelms the direct
  # hit-30 -> hit learning signal. Fall/alive/contact safety remains active.
  post_strike_root_tilt_weight: 0.0
  post_strike_recovery_progress_weight: 0.0
  post_strike_root_linear_velocity_weight: 0.0
  post_strike_root_linear_velocity_l2_weight: 0.0
  post_strike_root_angular_velocity_l2_weight: 0.0
  post_strike_root_height_deficit_weight: 0.0
  post_strike_both_feet_contact_weight: 0.0
  post_strike_ready_weight: 0.0

  # Keep a mild posture safety term and make symmetric momentum-to-zero costs
  # comparable to the exact-strike position reward near impact.
  pre_hit_root_tilt_weight: -1.0
  # Direct launch-state supervision gives the 30-step preload gate a dense
  # reason to enter swing with low momentum instead of correcting only at hit.
  pre_hit_root_angular_velocity_l2_weight: -3.0
  pre_hit_root_forward_velocity_l2_weight: -10.0
  strike_approach_pitch_rate_deadband_l2_weight: -10.0
  strike_approach_forward_velocity_deadband_l2_weight: -40.0
  exact_strike_pitch_rate_deadband_l2_weight: -8.0
  exact_strike_forward_velocity_deadband_l2_weight: -24.0
