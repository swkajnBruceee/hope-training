# Opt-in continuation of the resolved CompletePriors contract.  This is not
# WorkspaceExpansion and does not alter the task used by the active run.
defaults:
  - _self_

name: HOPEA3TargetConditionedReferenceFreeV13BCompletePriorsPrecisionRescue
gym_task: HOPE-FloatingTargetConditionedReferenceFreeV13BCompletePriorsPrecisionRescue-AgibotA3-v0
experiment_name: agibot_a3_target_conditioned_reference_free_v13b_complete_priors_precision_rescue
motion_manifest: /home/bistu/桌面/HOPETableTennis/a3_ik_point_offline_wrapper_v2/training_reference_bank_merged_20260807/training_manifest.json
validation_manifest: /home/bistu/桌面/HOPETableTennis/a3_ik_point_offline_wrapper_v2/training_reference_bank_merged_20260807/validation_manifest.json
v13b_migrated_warm_start: false

env:
  episode_length_s: 10.0
  staggered_stance_half_span_m: 0.06
  staggered_front_foot: right
  stance_lateral_widen_per_foot_m: 0.05
  stance_knee_flexion_rad: 0.48

motion:
  pose_range: {}
  velocity_range: {}
  joint_position_range: [0.0, 0.0]
  reset_perturbation_probability: 0.0
  hard_case_probability: 0.0
  hard_case_motion_ids: []
  hard_case_velocity_range: {}

actions:
  microstep_enabled: true
  microstep_step_limit_m: 0.02
  microstep_lowpass_alpha: 0.20
  upper_prelude_release_steps: 12

goal:
  contract_version: policy_strike_goal_10d/racket_contact_v1
  canonical_order: [position_xyz, velocity_xyz, normal_xyz, signed_time_to_hit]
  target_position_semantics: racket_reference_point_at_strike
  target_velocity_semantics: ideal_racket_impact_velocity
  target_normal_semantics: desired_racket_face_normal
  curriculum:
    progress_source: policy_updates_continued_from_source
    warmup_progress: 0.00
    ramp_end_progress: 0.60
    initial_position_half_range_m: [0.01, 0.01, 0.01]
    final_position_half_range_m: [0.08, 0.08, 0.08]
    initial_speed_fraction: 0.03
    final_speed_fraction: 0.20
    initial_normal_half_angle_deg: 2.0
    final_normal_half_angle_deg: 12.0
    initial_time_half_range_s: 0.02
    final_time_half_range_s: 0.10
    motion_alignment_enabled: true
    motion_alignment_start_progress: 0.00
    motion_alignment_end_progress: 0.60
    motion_alignment_include_prelude_s: false
    motion_alignment_time_range_s: [0.20, 0.60]
    private_motion_disable_progress: 0.70
    contract_assertions: true

training:
  # User-selected after the read-only Native/Common ablation screen.  This
  # remains a training initialization only; deployment does not load it.
  source_checkpoint: /home/bistu/桌面/HOPETableTennis/hope_training/whole_body_tracking/logs/rsl_rl/agibot_a3_target_conditioned_reference_free_v13b_complete_priors_rightfront_v1/2026-08-09_18-10-06_v13b_resetfixed_model18900_clean_23118_rightfront_16384x50000_resume_from2300_exact/model_5000.pt
  source_iteration: 5000
  source_historical_progress: 0.1000020000400008
  source_lower_alpha: 0.9999999999199976
  source_upper_alpha: 0.8999999998666626
  schedule_total_iterations: 50000
  upper_prior_hold_updates: 300
  upper_prior_max_step: 0.05
  upper_prior_withdrawal: performance_gated_monotonic
  # Start the physical upper-prior composition in the measured
  # controllability band.  The historical source alpha remains 0.90 for
  # provenance, while this rescue branch deliberately starts at 0.45 so the
  # target-conditioned student has usable racket-position authority.
  controllability_recovery_enabled: true
  controllability_start_alpha: 0.45
  controllability_min_alpha: 0.30
  # Performance-gated withdrawals happen first; this hard deadline guarantees
  # a teacher-free tail even if an external gate is delayed or unavailable.
  upper_force_zero_start_progress: 0.60
  upper_force_zero_progress: 0.70
  upper_hard_zero_enabled: true
  lower_prior_continuation: hold_or_monotonic_decline
  # Evaluation-only teacher-off probe.  The actor remains 98-D; these
  # private amplitudes are never part of its observation.
  upper_probe_interval_updates: 200
  upper_probe_max_steps: 600
  upper_probe_consecutive_passes: 2
  upper_probe_min_survival: 0.95
  upper_probe_min_hit_rate: 0.95
  upper_probe_max_position_error_m: 0.03
  upper_probe_max_normal_error_deg: 35.0
  upper_probe_max_velocity_error_mps: 1.2
  upper_probe_seed: 20260810
  # Populated per formal run.  A separate GPU worker writes only approved
  # teacher-off probe results; an absent or invalid file means HOLD.
  upper_gate_file: ""
  upper_gate_run_id: ""
  actor_only_warm_start: true
  fresh_critic: true
  fresh_optimizer: true
  restart_lr_schedule: true
  workspace_expansion_enabled: false
  preflight_required: true
  preflight_num_envs: 128
  preflight_iterations: [20, 100]
  long_training_blocked_until_preflight: true

rewards:
  # Precision Rescue uses one joint strike-quality objective.  Position,
  # velocity, normal, exact-hit, and the former wide recovery terms are kept
  # at zero so no component can compensate for another through an independent
  # additive reward.
  racket_position_weight: 0.0
  racket_velocity_weight: 0.0
  racket_normal_weight: 0.0
  racket_hit_precision_weight: 0.0
  racket_position_wide_weight: 0.0
  racket_position_wide_std_m: 0.50
  racket_position_wide_time_std_s: 0.18
  racket_strike_position_recovery_weight: 0.0
  racket_strike_position_recovery_std_m: 0.50
  racket_normal_wide_weight: 0.0
  racket_normal_wide_std_rad: 0.60
  racket_velocity_wide_weight: 0.0
  racket_velocity_wide_std_mps: 2.0
  velocity_wide_position_threshold_m: 0.02
  velocity_wide_position_excess_std_m: 0.05
  # Dimensionless smooth-bottleneck recovery: the worst component dominates.
  # The normal scale is deliberately broad enough to provide gradient around
  # the current ~90 degree error without making normal irrelevant.
  racket_joint_quality_weight: 10.0
  racket_joint_quality_position_std_m: 0.50
  racket_joint_quality_velocity_std_mps: 2.0
  racket_joint_quality_normal_std_rad: 1.0471976
  racket_joint_quality_time_std_s: 0.18
  racket_joint_quality_softmax_beta: 4.0
  racket_joint_quality_progress_weight: 0.25
  racket_joint_quality_regression_weight: 0.10
  racket_joint_quality_progress_clip: 0.25
  racket_joint_quality_regression_clip: 0.25

workspace_expansion_enabled: false
# Recovery-stage shaping: provide nonzero position signal at the current
# roughly 0.6 m error scale, then tighten this kernel after recovery.
precision_rescue_wide_position_weight: 0.0
precision_rescue_wide_position_std_m: 0.50
precision_rescue_wide_position_time_std_s: 0.18
