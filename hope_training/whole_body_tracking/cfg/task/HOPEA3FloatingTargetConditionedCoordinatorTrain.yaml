  # raw coordinator channels.  It is the minimum-norm ridge solution of the
  # measured 22-D local Jacobian.  Ridge values are motion-specific
  # (0:0.001, 1:0.001, 2:0.0005, 3:0.001, 4:0.0005, 5:0.0005), correcting
  # only the residual left by the frozen P0/P3 target response.  The frozen
  # upper actor still sees only the anchor target.
  coordinator_target_feedforward_enabled: true
  coordinator_target_feedforward_raw_clip: 0.15
