racket:
  adapter_external_offset_half_range: [0.01, 0.01, 0.01]
  adapter_external_zero_probability: 0.0
  adapter_external_paired: true

rewards:
  # Incremental paired control is the primary objective.  Absolute anchor
  # error is deliberately excluded until the local Jacobian is reliable.
  racket_position_weight: 0.0
  racket_position_y_weight: 0.0
  racket_position_fine_weight: 0.0
  racket_hit_coupled_weight: 0.0
  racket_velocity_weight: 0.05
  racket_normal_weight: 0.05
  racket_incremental_dense_huber_weight: 5.0
  racket_incremental_gain_weight: 2.0
  racket_incremental_cross_axis_weight: 5.0
  target_adapter_zero_hold_weight: 0.25

  # Retain bounded single-strike safety without optimizing fast recenter.
  post_strike_root_tilt_weight: -3.0
  post_strike_recovery_progress_weight: 0.0
  post_strike_root_linear_velocity_weight: 0.25
  post_strike_root_linear_velocity_l2_weight: -0.5
  post_strike_root_angular_velocity_l2_weight: -0.3
  post_strike_root_height_deficit_weight: -20.0
  post_strike_both_feet_contact_weight: 0.5
  post_strike_ready_weight: 0.25
  fall_weight: -100.0
  alive_weight: 0.5

  pre_hit_root_tilt_weight: -1.0
  pre_hit_root_angular_velocity_l2_weight: -1.0
  pre_hit_root_forward_velocity_l2_weight: -2.0
  strike_approach_pitch_rate_deadband_l2_weight: -1.0
