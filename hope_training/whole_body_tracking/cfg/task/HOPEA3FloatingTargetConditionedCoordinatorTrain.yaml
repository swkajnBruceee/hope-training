# P3/P0 continuation: six anchors, one strike each, paired local targets.
# Frozen model_900 keeps its anchor-only observation; only the trainable 22-D
# coordinator receives the external target through its private 56-D copy.
defaults:
  - HOPEA3FloatingTargetConditionedCoordinator
  - _self_

name: HOPEA3FloatingTargetConditionedCoordinatorTrain
experiment_name: agibot_a3_floating_target_conditioned_p3_coordinator_train
manifest_subset_size: 6

env:
  # Hit occurs near control step 80.  Reset shortly afterwards so the frozen
  # five-second recovery problem cannot dominate this target-control pilot.
  episode_length_s: 2.2

