# P5D-2: multi-reference residual tracking.  This remains a low-level
# reference tracker: model_900/model_3396 and the support state machine are
# frozen, while the new policy sees no motion ID and learns one shared
# waist/right-arm residual across the explicit train manifest.
defaults:
  - _self_

name: HOPEA3FloatingPriorGuidedReferenceTrackerP5D2
gym_task: HOPE-FloatingPriorGuidedReferenceTracker-AgibotA3-v0
experiment_name: agibot_a3_p5d_prior_guided_reference_tracker_p5d2

env:
  episode_length_s: 6.5

motion:
  fixed_motion_id: null
  manifest_balance_strokes: false
  # Reset-time reference sampling; actor never observes these identifiers.
  # Formal 2026-08-04 run used uniform for reproducibility.  The runtime also
  # supports balanced_by_region, difficulty_weighted and curriculum.
  reference_sampling_mode: uniform
  reference_curriculum_stage: 0
  reference_curriculum_sizes: [12, 25, 16]

tracker:
  upper_correction_scale_rad: 0.10

rewards:
  reference_joint_position_weight: 3.0
  reference_joint_velocity_weight: 1.5
  racket_position_weight: 8.0
  racket_position_fine_weight: 2.0
  racket_velocity_weight: 3.0
  racket_normal_weight: 2.0
  racket_hit_coupled_weight: 1.0
  racket_hit_precision_weight: 8.0
  action_residual_l2_weight: -0.01
  joint_limit_weight: -20.0
  feet_slip_weight: -1.0
  fall_weight: -150.0
  alive_weight: 1.0
