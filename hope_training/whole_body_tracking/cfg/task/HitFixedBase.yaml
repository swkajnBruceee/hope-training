# =============================================================================
# Fixed-base A3 table-tennis ball-touch task.
#
# Selected with `task=HitFixedBase`. This is a pure RL task on the table-tennis
# scene, not a BeyondMimic motion-imitation task, so it intentionally has no
# `registry_name` or `motion_file` requirement.
# =============================================================================

name: HitFixedBase
gym_task: HOPE-TableTennis-AgibotA3-HitFixedBase-v0
experiment_name: agibot_a3_hit_fixed_base

defaults:
  - /base/env_base@_here_
  - _self_

env:
  num_envs: 64
  env_spacing: 6.0
  episode_length_s: 3.0
