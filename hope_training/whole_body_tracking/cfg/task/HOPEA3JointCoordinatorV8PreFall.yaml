# V8 keeps the unified V7 controller and qualified impact contract.  It makes
# the audit's 30 degree stability screen a real, sustained post-hit failure so
# PPO optimizes recovery before a root-height collapse is unavoidable.
defaults:
  - HOPEA3JointCoordinatorV7Settling
  - _self_

name: HOPEA3JointCoordinatorV8PreFall
experiment_name: agibot_a3_joint_coordinator_v8_prefall_20260727

terminations:
  recovery_tilt_max_deg: 30.0
  recovery_tilt_required_steps: 3
