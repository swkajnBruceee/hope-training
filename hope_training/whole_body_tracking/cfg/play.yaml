# =============================================================================
# Hydra eval/export config for HOPE Agibot A3 WBC.
#
# Usage:
#   python scripts/play.py task=HOPEPingPong algo=ppo num_envs=2 \
#       checkpoint=logs/rsl_rl/agibot_a3_hope/<run>/model_*.pt
#
# Loads the trained policy from a local checkpoint or optional WandB run, runs it, and
# exports policy.onnx next to the checkpoint. Without wandb_path or checkpoint it
# falls back to the latest local checkpoint under logs/rsl_rl/<experiment>/.
# =============================================================================

defaults:
  - task: HOPEPingPong
  - algo: ppo
  - _self_

headless: false
device: cuda:0
num_envs: 2

wandb_path: null      # optional <entity>/<project>/<run_id> trained run to load
checkpoint: null      # explicit local model_*.pt path (takes precedence over wandb_path / latest-local)
registry_name: null   # motion override for the local-checkpoint path (falls back to task.registry_name)
motion_file: null     # explicit motion .npz override
motion_manifest: null
manifest_subset_size: null
manifest_frame_z_offset: null
validate_stance_contract: false  # opt-in prepositioned-manifest validation
stance_contract_mode: null       # null=allow fixed/prepositioned mixed manifests

video: false
video_length: 200
max_steps: null

# Optional live/video camera override. These values frame the fixed-base A3
# native strike scene around the robot at x~=3.15, y~=-0.34.
camera_eye: [5.0, -2.5, 2.2]
camera_lookat: [3.15, -0.34, 1.05]

hydra:
  job:
    chdir: false
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
