# Evaluation-only compatibility recipe for checkpoints written after the model_2800 warm-start.
# Those checkpoints carry the inherited 29-channel non-passive residual contract.  This file does
# not change training; it lets the audit runner reconstruct the contract saved in model metadata.

name: HitterPingPongA5StanceCheckpointCompatEval

runner:
  num_steps_per_env: 24
  max_iterations: 1
  save_interval: 1
  empirical_normalization: false

policy:
  class_name: ResidualMeanActorCritic
  residual_architecture: structured_film
  actor_hidden_dims: [512, 256, 128]
  critic_hidden_dims: [512, 256, 128]
  activation: elu
  init_noise_std: 1.0
  residual_hidden_dims: [256, 128]
  structured_proprio_hidden_dims: [128, 64]
  structured_goal_hidden_dims: [64, 32]
  structured_time_hidden_dims: [16, 8]
  structured_fusion_hidden_dims: [256, 128]
  structured_film_hidden_dims: [32, 32]
  residual_delta_q_max_rad: 0.05
  residual_time_scale: 1.0
  residual_train_std: false

algorithm:
  learning_rate: 0.0003
  schedule: adaptive
  desired_kl: 0.01
  entropy_coef: 0.01
  num_learning_epochs: 5
  num_mini_batches: 6
  gamma: 0.99
  lam: 0.95
  clip_param: 0.2
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  max_grad_norm: 1.0
