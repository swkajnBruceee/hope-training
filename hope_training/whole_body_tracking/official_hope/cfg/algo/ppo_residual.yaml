# First implementation milestone: Frozen HOPE + Zero-init Bounded Residual Mean Actor.
# This file is deliberately separate from cfg/algo/ppo.yaml so the baseline remains
# reproducible and `algo=ppo` never silently changes architecture.

name: HitterPingPongResidualPPO

runner:
  num_steps_per_env: 24
  max_iterations: 300000000000
  save_interval: 100
  # Baseline model_21800 and the v1.4 observation contract use raw 110D observations.
  # Keep this disabled so Residual checkpoints remain self-contained and reproducible.
  empirical_normalization: false

policy:
  class_name: ResidualMeanActorCritic
  actor_hidden_dims: [512, 256, 128]
  critic_hidden_dims: [512, 256, 128]
  activation: elu
  init_noise_std: 1.0
  residual_hidden_dims: [256, 128]
  residual_delta_q_max_rad: 0.05
  residual_time_scale: 1.0
  residual_train_std: false

algorithm:
  learning_rate: 0.001
  schedule: adaptive
  desired_kl: 0.01
  entropy_coef: 0.01
  num_learning_epochs: 5
  num_mini_batches: 6
  gamma: 0.99
  lam: 0.95
  clip_param: 0.2
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  max_grad_norm: 1.0
