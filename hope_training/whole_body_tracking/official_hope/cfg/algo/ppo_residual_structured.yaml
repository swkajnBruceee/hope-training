# A4 exploratory ablation: Frozen HOPE + Structured Residual Mean.
# Only the residual input organization differs from cfg/algo/ppo_residual.yaml.

name: HitterPingPongStructuredResidualPPO

runner:
  num_steps_per_env: 24
  max_iterations: 1500
  save_interval: 100
  empirical_normalization: false

policy:
  class_name: ResidualMeanActorCritic
  residual_architecture: structured
  actor_hidden_dims: [512, 256, 128]
  critic_hidden_dims: [512, 256, 128]
  activation: elu
  init_noise_std: 1.0
  residual_hidden_dims: [256, 128]  # unused by structured architecture; kept for config parity
  structured_proprio_hidden_dims: [128, 64]
  structured_goal_hidden_dims: [64, 32]
  structured_time_hidden_dims: [16, 8]
  structured_fusion_hidden_dims: [256, 128]
  residual_delta_q_max_rad: 0.05
  residual_time_scale: 1.0
  residual_train_std: false

algorithm:
  learning_rate: 0.0001
  schedule: fixed
  desired_kl: 0.01
  entropy_coef: 0.01
  num_learning_epochs: 5
  num_mini_batches: 6
  gamma: 0.99
  lam: 0.95
  clip_param: 0.2
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  max_grad_norm: 1.0
