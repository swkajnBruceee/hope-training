# Short-transition PPO stage 1.
# Inherit the frozen formal HitterPingPong recipe and change only:
#   1) BH conditioned target generation (the corrected-core protocol);
#   2) the pre-swing hold distribution (60 control steps = 1.2 s at 50 Hz).
# Actor contract, residual bound, normal, reward, tuple bank, and all other task fields remain
# inherited from HOPEPingPong.yaml.
defaults:
  - HOPEPingPong
  - _self_

name: HitterPingPongShortTransitionStage1

motion:
  # Startup/reset hold remains an entry condition only. Wrapped successor swings use the
  # real strike-to-strike scheduler below instead of interpreting this as the transition interval.
  hold_steps_range:
  - 60
  - 60
  hold_long_prob: 0.0
  hold_long_steps_range:
  - 0
  - 0

racket:
  vb_target_conditioning: true
  vb_target_conditioning_clip_id: 1
  vb_target_conditioning_k_z: 0.75
  vb_target_conditioning_v_ref: 0.25
  vb_target_conditioning_delta_max: 0.40
  # Stage 1 difficulty is defined in actual strike-to-strike seconds. The scheduler solves the
  # successor hold from the previous/new clip strike phases; full clips remain phase-faithful.
  target_strike_interval_s:
  - 2.40
  - 2.60
  # FH horizontal correction remains a later ablation; it is intentionally off here.
  fh_target_conditioning: false
  fh_target_conditioning_clip_id: 0
  fh_target_conditioning_delta_vx: 0.0
  fh_target_conditioning_delta_vy: 0.0
  fh_target_conditioning_vx_max: null
